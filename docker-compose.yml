services:
  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ./docker/proxy/conf.d:/etc/nginx/conf.d
      - ./docker/proxy/ssl:/etc/nginx/ssl
    network_mode: host
  
  mapper:
    build:
      context: ./docker/map
    ports:
      - "8000:8000"
  
  geoserver:
    build:
      context: https://github.com/hammad93/hurricane-geoserver.git#main:docker
    environment:
      - GEOSERVER_ADMIN_PASSWORD=${GEOSERVER_ADMIN_PASSWORD}
    ports:
      - "6004:8080"
    volumes:
      - ./wms_data/:/opt/geoserver_data
  
  agent:
    build:
      context: https://github.com/hammad93/hurricane-agent.git#main:docker
    environment:
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SQL_USER=${SQL_USER}
      - SQL_PASS=${SQL_PASS}
      - SQL_HOST=${SQL_HOST}
      - SQL_PORT=${SQL_PORT}
      - OPENWEBUI_TOKEN=${OPENWEBUI_TOKEN}
      - WP_USER=${WP_USER}
      - WP_PASS=${WP_PASS}
    network_mode: host
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.hourly.schedule: "0 0 * * * *"
      ofelia.job-exec.hourly.command: "python /hurricane-agent/report.py hourly"
      ofelia.job-exec.daily.schedule: "0 0 0 * * *"
      ofelia.job-exec.daily.command: "python /hurricane-agent/report.py daily"
      ofelia.job-exec.five_min.schedule: "0 */5 * * * *"
      ofelia.job-exec.five_min.command: "python /hurricane-agent/report.py five_min"

  satellites:
    build:
      context: https://github.com/hammad93/hurricane-satellites.git#main:docker
    environment:
      - GEOSERVER_WORKSPACE=${GEOSERVER_WORKSPACE}
      - GEOSERVER_URL=${GEOSERVER_URL}
      - GEOSERVER_ADMIN_USER=${GEOSERVER_ADMIN_USER}
      - GEOSERVER_ADMIN_PASSWORD=${GEOSERVER_ADMIN_PASSWORD}
      - EUMETSAT_PASS=${EUMETSAT_PASS}
      - EUMETSAT_SECRET=${EUMETSAT_SECRET}
    volumes:
      - ./wms_data/:/output
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.fifteen-min.schedule: "0 */15 * * * *"
      ofelia.job-exec.fifteen-min.command: "python /app/hurricane-satellites/test.py --clean=True --wms=True"

  ofelia:
    image: mcuadros/ofelia:latest
    depends_on:
      - agent
      - satellites
    command: daemon --docker -f label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
